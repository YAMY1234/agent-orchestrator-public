name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -W error -m unittest discover -s tests -v
      - run: python -m py_compile *.py agent_orchestrator/*.py scripts/*.py launchd/*.py
      - run: bash -n scripts/*.sh launchd/*.sh
      - name: Validate examples and inline Dashboard JavaScript
        run: |
          python -m json.tool examples/dashboard.local.json >/dev/null
          node - <<'JS'
          const fs = require("fs");
          const source = fs.readFileSync("static/index.html", "utf8");
          const start = source.lastIndexOf("<script>");
          const end = source.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("inline script block missing");
          new Function(source.slice(start + "<script>".length, end));
          JS
